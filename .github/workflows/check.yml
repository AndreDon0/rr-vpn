name: Android checks
on:
  push:
    branches: [main]
    paths-ignore: ['updates/**', '**.md']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: sh scripts/fetch-core.sh
      - run: sh ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      # No APK artifacts or signing keys are uploaded. Official releases are signed locally.
